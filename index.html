<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>책장</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="site-brand">
      <a href="#/" class="brand-mark">BOOKSHELF</a>
      <button class="icon-btn" type="button" aria-label="검색">
        <svg width="15" height="15" viewBox="0 0 15 15" fill="none">
          <circle cx="6.3" cy="6.3" r="5" stroke="currentColor" stroke-width="1.3"/>
          <line x1="10.1" y1="10.1" x2="14" y2="14" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
    <nav class="site-nav" id="siteNav">
      <a href="#/" class="nav-link" data-route="shelf">책장</a>
      <a href="#/members" class="nav-link" data-route="members">멤버</a>
    </nav>
    <div class="session-bar" id="sessionBar"></div>
  </header>

  <main id="view"></main>

  <button class="comments-digest-btn" id="commentsDigestBtn" type="button" aria-label="댓글 알림" hidden>
    <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
      <path d="M4 15 L4 8 a6 6 0 0 1 12 0 L16 15 L18 17 L2 17 Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
      <path d="M8 17 a2 2 0 0 0 4 0" stroke="currentColor" stroke-width="1.4"/>
    </svg>
  </button>
  <div class="comments-digest-panel" id="commentsDigestPanel" hidden></div>

  <script type="module" src="app.js"></script>

</html>
